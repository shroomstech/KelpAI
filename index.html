<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KelpAI</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #121215;
            --border: #27272a;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --user-bg: #18181b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .tag {
            font-size: 0.75rem;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 4px;
        }

        select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 6px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-bg);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--muted);
        }

        button {
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled, select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        footer {
            padding: 10px 20px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--muted);
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="brand">
                <h1>KelpAI</h1>
                <span class="tag">OSDev & GameDev</span>
            </div>
            <select id="modelSelect">
                <option value="kelp-flash">kelp-flash</option>
                <option value="fatality-2">fatality-2</option>
            </select>
        </header>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Loading model..." disabled />
            <button id="sendBtn" disabled>Send</button>
        </div>

        <footer>
            Made in Germany
        </footer>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

        env.allowLocalModels = false;

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');

        const MODEL_MAP = {
            'kelp-flash': 'Xenova/Qwen1.5-0.5B-Chat',
            'fatality-2': 'Xenova/Qwen1.5-1.8B-Chat'
        };

        const SYSTEM_PROMPT = "You are KelpAI, a specialized assistant for OSDev and GameDev. Answer directly, technically precise, and deliver clean code. Never use em dashes (--) in your output, use standard punctuation like periods or commas instead.";

        let generator = null;

        async function loadModel(modelKey) {
            userInput.disabled = true;
            sendBtn.disabled = true;
            modelSelect.disabled = true;

            try {
                generator = await pipeline('text-generation', MODEL_MAP[modelKey], {
                    progress_callback: (p) => {}
                });

                userInput.placeholder = "Enter message...";
                userInput.disabled = false;
                sendBtn.disabled = false;
                modelSelect.disabled = false;
            } catch (err) {
                console.error(err);
                modelSelect.disabled = false;
            }
        }

        function appendMessage(text, className) {
            const msg = document.createElement('div');
            msg.className = `message ${className}`;
            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msg;
        }

        function sanitizeOutput(text) {
            return text.replace(/--/g, '. ').replace(/—/g, ', ');
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text || !generator) return;

            appendMessage(text, "user-message");
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            const loadingMsg = appendMessage("...", "ai-message");

            try {
                const prompt = `<|im_start|>system\n${SYSTEM_PROMPT}<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
                
                const result = await generator(prompt, {
                    max_new_tokens: 384,
                    temperature: 0.2,
                    do_sample: true
                });

                const rawOutput = result[0].generated_text;
                let aiResponse = rawOutput.split('<|im_start|>assistant\n')[1]?.replace('<|im_end|>', '').trim() || rawOutput;

                loadingMsg.innerText = sanitizeOutput(aiResponse);
            } catch (err) {
                loadingMsg.innerText = "Generation error.";
                console.error(err);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        modelSelect.addEventListener('change', (e) => {
            loadModel(e.target.value);
        });

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        loadModel('kelp-flash');
    </script>
</body>
</html>
