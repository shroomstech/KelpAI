<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KelpAI</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #09090b;
            --border: #27272a;
            --text: #f4f4f5;
            --muted: #71717a;
            --user-bg: #18181b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .tag {
            font-size: 0.75rem;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, input[type="password"] {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        input[type="password"] {
            width: 130px;
        }

        select {
            cursor: pointer;
        }

        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 6px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-bg);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--muted);
        }

        button {
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover {
            opacity: 0.9;
        }

        footer {
            padding: 8px 24px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--muted);
            text-align: right;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
            }
            .controls {
                width: 100%;
                justify-content: space-between;
            }
            .tag {
                display: none;
            }
            .chat-box {
                padding: 16px;
            }
            .message {
                max-width: 90%;
            }
            .input-area {
                padding: 12px 16px;
            }
            footer {
                padding: 6px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="brand">
                <h1>KelpAI</h1>
                <span class="tag">OSDev & GameDev</span>
            </div>
            <div class="controls">
                <input type="password" id="apiKeyInput" placeholder="API Key..." />
                <select id="modelSelect">
                    <option value="GPT-6...">GPT-6...</option>
                    <option value="CLD-3.5...">CLD-3.5...</option>
                    <option value="GMI-2.5...">GMI-2.5...</option>
                    <option value="Codecmedia-4.5...">Codecmedia-4.5...</option>
                </select>
            </div>
        </header>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Enter message..." />
            <button id="sendBtn">Send</button>
        </div>

        <footer>
            Made in Germany
        </footer>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');
        const apiKeyInput = document.getElementById('apiKeyInput');

        const SYSTEM_PROMPT = "You are KelpAI, a specialized assistant for OSDev and GameDev. Answer directly, technically precise, and deliver clean code. Never use em dashes in your output, use standard punctuation like periods or commas instead.";

        function appendMessage(text, className) {
            const msg = document.createElement('div');
            msg.className = `message ${className}`;
            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msg;
        }

        function sanitizeOutput(text) {
            return text.replace(/--/g, '. ').replace(/—/g, ', ');
        }

        async function handleSend() {
            const text = userInput.value.trim();
            const selectedModel = modelSelect.value;
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;

            appendMessage(text, "user-message");
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            const loadingMsg = appendMessage("...", "ai-message");

            try {
                let aiResponse = "";

                // Routing basierend auf dem Modell-Namen
                if (selectedModel.startsWith("GPT") || selectedModel.startsWith("Codecmedia")) {
                    if (!apiKey) throw new Error("API Key required for GPT models.");
                    
                    const res = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'gpt-4o-mini', // Fallback Mapping für Testzwecke
                            messages: [
                                { role: "system", content: SYSTEM_PROMPT },
                                { role: "user", content: text }
                            ],
                            temperature: 0.2
                        })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    aiResponse = data.choices[0].message.content;

                } else if (selectedModel.startsWith("CLD")) {
                    if (!apiKey) throw new Error("API Key required for Claude models.");

                    const res = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': apiKey,
                            'anthropic-version': '2023-06-01',
                            'anthropic-dangerous-direct-browser-access': 'true'
                        },
                        body: JSON.stringify({
                            model: 'claude-3-5-sonnet-20241022',
                            system: SYSTEM_PROMPT,
                            max_tokens: 1024,
                            messages: [{ role: "user", content: text }]
                        })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    aiResponse = data.content[0].text;

                } else if (selectedModel.startsWith("GMI")) {
                    // GMI agiert hier als direkter Simulator / Relay mit freiem Zugriff
                    aiResponse = `[GMI Gateway] Processing via Gemini core for query: "${text}". OSDev/GameDev focus active. System operational.`;
                }

                loadingMsg.innerText = sanitizeOutput(aiResponse.trim());
            } catch (err) {
                loadingMsg.innerText = `Gateway Error: ${err.message}`;
                console.error(err);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
